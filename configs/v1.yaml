schema_version: '1.0.0'
project_name: ChainMax
project_folder: chainmax
dataset_name: chainmax-2k
dataset_slug: chainmax-2k
dataset_version: '1.0.0'
github_repository_name: chainmax
seed: 20261025
target_base_instances: 2000
instances_per_family: 200
instances_per_family_level: 50
structural_levels: [L1, L2, L3, L4]
quantity_domain: bounded_integer
cost_unit: cent
demand_policy: exact
shortages_allowed: false
reference:
  native_backend: ortools_cp_sat
  maxsat_backend: pysat_rc2
  require_both_optimal: true
  require_exact_cost_agreement: true
encoding:
  format: legacy_dimacs_wcnf
  integer_encoding: binary
  pb_encoder: bdd
review:
  require_primary_review_for_every_record: true
  minimum_second_review_records: 200
resources:
  native_seconds: 15
  candidate_seconds: 45
  candidate_memory_mb: 1536
  attempts_per_slot: 8
  worker_processes: 2
profiles:
  L1: {sources: 2, markets: 1, products: 1, periods: 2, demand_min: 2, demand_max: 4, capacity_slack: 4, stock_slack: 3, extra_route_probability: 0.65}
  L2: {sources: 3, markets: 1, products: 2, periods: 3, demand_min: 2, demand_max: 5, capacity_slack: 4, stock_slack: 3, extra_route_probability: 0.75}
  L3: {sources: 3, markets: 2, products: 2, periods: 3, demand_min: 2, demand_max: 5, capacity_slack: 3, stock_slack: 2, extra_route_probability: 0.8}
  L4: {sources: 4, markets: 2, products: 3, periods: 4, demand_min: 2, demand_max: 6, capacity_slack: 2, stock_slack: 2, extra_route_probability: 0.85}
family_profile_overrides:
  F06:
    L4: {products: 1, demand_max: 4}
  F09:
    L3: {products: 1, demand_max: 4}
    L4: {sources: 3, products: 2, periods: 3, demand_max: 3}
