name: correctness
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard generated artifacts
        shell: bash
        run: test -z "$(git ls-files -- data/ audit/ releases/)"
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m chainmax doctor
      - run: python -m pytest -q
      - run: python -m chainmax build --config configs/v1.yaml --accepted-limit 4
      - run: python -m chainmax audit --dataset data/chainmax-1k.jsonl --all
